<title>EPMS Workbooks 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
/* Layout: nurse list on the left, the selected workbook on a "desk" on the right; one printed page at a time, like leafing through the file */
:root{
  --bg:#EEF1EA; --panel:#FFFFFF; --panel-2:#E4EADD; --ink:#1B2419; --ink-2:#4A5646; --muted:#6B7667; --line:#D2DACB;
  --green:#3E6B2B; --green-ink:#FFFFFF; --green-soft:#E1EBD9; --amber:#F2B705; --amber-soft:#FFF3C4; --amber-ink:#3A2C00;
  --red:#B3261E; --red-soft:#FBE7E4; --blue-soft:#E3EBF7; --blue-ink:#1F3F7A; --desk:#D9DFD3; --focus:#1F5FBF;
  --serif:"Source Serif 4",Georgia,"Times New Roman",serif; --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141912; --panel:#1C231A; --panel-2:#252E22; --ink:#E6ECE2; --ink-2:#BCC6B6; --muted:#98A393; --line:#35402F;
  --green:#7DB35F; --green-ink:#10180C; --green-soft:#26361E; --amber:#F2C230; --amber-soft:#3A3113; --amber-ink:#FFE9A3;
  --red:#F2867D; --red-soft:#3A1D1A; --blue-soft:#1C2A40; --blue-ink:#BFD3F5; --desk:#0F130E; --focus:#8AB4FF; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#141912; --panel:#1C231A; --panel-2:#252E22; --ink:#E6ECE2; --ink-2:#BCC6B6; --muted:#98A393; --line:#35402F;
  --green:#7DB35F; --green-ink:#10180C; --green-soft:#26361E; --amber:#F2C230; --amber-soft:#3A3113; --amber-ink:#FFE9A3;
  --red:#F2867D; --red-soft:#3A1D1A; --blue-soft:#1C2A40; --blue-ink:#BFD3F5; --desk:#0F130E; --focus:#8AB4FF; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1320px;margin:0 auto}
h1,h2{font-family:var(--serif);margin:0;text-wrap:balance}
h1{font-size:clamp(22px,3.4vw,28px)} h2{font-size:clamp(19px,2.6vw,23px)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--green);font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:end;justify-content:space-between;padding-block:18px 12px}
.snap{font-size:13px;color:var(--ink-2);max-width:60ch}
.layout{display:grid;grid-template-columns:280px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:860px){ .layout{grid-template-columns:1fr} }

/* nurse list */
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px)}
@media (max-width:860px){ .list{position:static} }
.list h3{margin:0;padding:10px 14px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.nurse{display:grid;gap:3px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 14px;cursor:pointer}
.nurse:last-child{border-bottom:0}
.nurse:hover{background:var(--panel-2)}
.nurse[aria-current="true"]{background:var(--green-soft);box-shadow:inset 3px 0 0 var(--green)}
.nurse b{font-weight:700}
.nurse .meta{font-size:12.5px;color:var(--muted)}
.nurse[disabled]{cursor:default;opacity:.75} .nurse[disabled]:hover{background:none}
.chip{display:inline-block;font-size:11.5px;font-weight:700;border-radius:99px;padding:1px 8px;justify-self:start}
.c-ready{background:var(--blue-soft);color:var(--blue-ink)} .c-draft{background:var(--amber-soft);color:var(--amber-ink)}
.c-none{background:var(--panel-2);color:var(--ink-2)} .c-free{background:var(--green-soft);color:var(--green)}

/* viewer */
.viewer{display:grid;gap:12px;min-width:0}
.head{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.head .row1{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:start;justify-content:space-between}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--ink-2)}
.warn{background:var(--amber-soft);color:var(--amber-ink);border-radius:9px;padding:9px 12px;font-size:14px}
.warn ul{margin:4px 0 0;padding-left:18px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.btn{font:inherit;font-size:14px;font-weight:600;border-radius:9px;padding:7px 12px;min-height:38px;cursor:pointer;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.btn:hover{border-color:var(--green)} .btn.primary:hover{filter:brightness(1.07)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.nurse:focus-visible,.tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.dlnote{font-size:12.5px;color:var(--muted)}

.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.group{display:flex;gap:4px;padding:3px;border-radius:10px;background:var(--panel-2);flex:none}
.tab{font:inherit;font-size:13px;font-weight:600;border:0;background:transparent;color:var(--ink-2);border-radius:7px;padding:5px 9px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tab.q{color:var(--green)}

.desk{background:var(--desk);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.pager .where{font-weight:700;font-size:14px}
.pager .where span{font-weight:500;color:var(--ink-2)}
.paperbox{overflow:auto;border-radius:4px;max-height:none}
.paperbox.zoom{max-height:78vh}
.paper{display:block;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18);margin:0 auto;max-width:100%;height:auto}
.paperbox.zoom .paper{max-width:none;width:1600px}
.paper.portrait{max-width:min(100%,860px)}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:9px;font-weight:600;font-size:14px;max-width:90vw}
@media (prefers-reduced-motion:no-preference){ .paper{transition:opacity .15s} .paper.loading{opacity:.35} }
</style>

<div class="wrap">
  <header class="top">
    <div><div class="eyebrow">UCH Nurses EPMS 2025 · Admin</div><h1>Workbooks, as they'll be submitted</h1></div>
    <p class="snap" id="snap"></p>
  </header>

  <div class="layout">
    <nav class="list" aria-label="Nurses"><h3>Nurses</h3><div id="nurses"></div></nav>
    <main class="viewer" id="viewer"></main>
  </div>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

<script>
const DATA = __DATA__;
(function(){
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let cur = null, form = 0, page = 1, zoom = false, downloads;
const store = { get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };
function toast(m){ const t=$("toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2800); }

$("snap").textContent = `Snapshot taken ${DATA.taken}. Each page below is the workbook exactly as it prints, with signatures and comments. When a nurse changes her answers, ask Claude to refresh this page.`;

function renderList(){
  $("nurses").innerHTML = DATA.nurses.map(n => `<button class="nurse" data-slug="${n.slug}" ${n.files?"":"disabled"} aria-current="${cur&&cur.slug===n.slug}">
    <b>${esc(n.name)}</b><span class="meta">${esc(n.role)}</span><span class="chip ${n.chip}">${esc(n.status)}</span></button>`).join("");
}
function forms(n){ // tabs: contract, then each quarter's months and appraisal, then summary
  const s = n.files.sheets, out = [];
  s.forEach((x,i)=> out.push({i, label:x.label.replace(" review","").replace("Quarter ","Q").replace(" appraisal",""), full:x.label, first:x.first, pages:x.pages, q:/Quarter/.test(x.label)}));
  out.push({i:s.length, label:"One-page summary", full:"One-page summary", summary:true, pages:1});
  return out;
}
function select(slug, keepPlace){
  const n = DATA.nurses.find(x=>x.slug===slug && x.files); if(!n) return;
  cur = n; if(!keepPlace){ form = 0; page = 1; }
  store.set("epms-wb-nurse", slug);
  try{ if(location.hash !== "#"+slug) history.replaceState(null,"","#"+slug); }catch(e){}
  renderList(); renderViewer();
}
function renderViewer(){
  const n = cur, F = forms(n), f = F[form];
  const groups = [[F[0]]]; let g=[];
  F.slice(1).forEach(x=>{ if(x.summary){ if(g.length) groups.push(g); g=[]; groups.push([x]); return; } g.push(x); if(x.q){ groups.push(g); g=[]; } });
  if(g.length) groups.push(g);
  $("viewer").innerHTML = `
    <section class="head">
      <div class="row1">
        <div><div class="eyebrow">${esc(n.kind)}</div><h2>${esc(n.name)}</h2></div>
        <span class="chip ${n.chip}" style="font-size:13px;padding:3px 10px">${esc(n.status)}</span>
      </div>
      <div class="facts">${n.facts.map(x=>`<span>${esc(x)}</span>`).join("")}</div>
      ${n.issues && n.issues.length ? `<div class="warn"><b>${n.draft?"This is a draft built from her answers so far. Not ready to submit:":"Check before sending:"}</b><ul>${n.issues.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
      <div class="acts">
        <button class="btn primary" data-dl="xlsx">Download workbook (.xlsx)</button>
        <button class="btn" data-dl="pdf">Download printed view (PDF)</button>
        <button class="btn" data-dl="summary">Download one-page summary (PDF)</button>
      </div>
      <div class="dlnote" id="dlnote">The .xlsx is the file she submits. The printed-view PDF is these same pages, for checking or printing.</div>
    </section>
    <nav class="tabs" role="tablist" aria-label="Forms in this workbook">${groups.map(gr=>`<div class="group">${gr.map(x=>`<button class="tab ${x.q?"q":""}" role="tab" data-form="${x.i}" aria-selected="${x.i===form}" title="${esc(x.full)}">${esc(x.label)}</button>`).join("")}</div>`).join("")}</nav>
    <section class="desk">
      <div class="pager">
        <div class="where">${esc(f.full)}${f.pages>1?` <span>· page ${page} of ${f.pages}</span>`:""}</div>
        <div class="acts">
          <button class="btn" id="prev" aria-label="Previous page">← Previous</button>
          <button class="btn" id="next" aria-label="Next page">Next →</button>
          <button class="btn" id="zoom" aria-pressed="${zoom}">${zoom?"Fit to screen":"Zoom in"}</button>
        </div>
      </div>
      <div class="paperbox ${zoom?"zoom":""}"><img class="paper ${f.summary||!/Performance contract/.test(f.full)?"portrait":""}" id="paper" alt="${esc(n.name)}: ${esc(f.full)}${f.pages>1?", page "+page:""}" src="${esc(src(n,f))}"></div>
    </section>`;
  const allPages = n.files.pages.length;
  const abs = f.summary ? allPages+1 : f.first + page - 1;
  $("prev").disabled = abs<=1; $("next").disabled = abs>=allPages+1;
  $("prev").onclick = ()=>step(-1); $("next").onclick = ()=>step(1);
  $("zoom").onclick = ()=>{ zoom=!zoom; renderViewer(); };
  if(!downloads){ document.querySelectorAll("[data-dl]").forEach(b=>b.disabled=true); $("dlnote").textContent = "Downloads open in the Claude app or claude.ai. If the buttons stay grey, reload the page."; }
}
function src(n,f){ return f.summary ? `${n.slug}/summary.jpg` : `${n.slug}/${n.files.pages[f.first + page - 2]}`; }
function step(d){
  const F = forms(cur); let f = F[form];
  if(f.summary){ if(d<0){ form = F.length-2; page = F[form].pages; } }
  else if(page + d >= 1 && page + d <= f.pages){ page += d; }
  else if(d>0 && form < F.length-1){ form++; page = 1; }
  else if(d<0 && form > 0){ form--; page = F[form].pages; }
  renderViewer();
}
document.addEventListener("click", async e=>{
  const nb = e.target.closest(".nurse[data-slug]"); if(nb && !nb.disabled){ select(nb.dataset.slug); return; }
  const tb = e.target.closest(".tab[data-form]"); if(tb){ form = +tb.dataset.form; page = 1; renderViewer(); return; }
  const db = e.target.closest("[data-dl]"); if(db && cur){
    if(!downloads){ toast("Downloads aren't available in this view."); return; }
    const b = cur.files.base, map = {xlsx:[`${cur.slug}/workbook.xlsx.txt`, `${b}.xlsx`], pdf:[`${cur.slug}/${b}_Rendered.pdf`, `${b}_Printed.pdf`], summary:[`${cur.slug}/${b}_Summary.pdf`, `${b}_Summary.pdf`]};
    const [url, name] = map[db.dataset.dl];
    db.disabled = true;
    try{
      const r = await fetch(url); if(!r.ok) throw new Error("fetch");
      let data;
      if(url.endsWith(".xlsx.txt")){ const bin = atob((await r.text()).trim()); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); data = new Blob([u]); }
      else data = await r.blob();
      await downloads.save({filename:name, data}); toast("Saved "+name);
    }catch(err){ const c = err && err.code; if(c!=="declined") toast(c==="rate_limited" ? "A save is already open. Finish that one first." : "Couldn't save the file. Try again."); }
    db.disabled = false;
  }
});
document.addEventListener("keydown", e=>{ if(!cur || e.target.closest("input,textarea")) return; if(e.key==="ArrowRight") step(1); if(e.key==="ArrowLeft") step(-1); });

renderList();
const first = (location.hash||"").slice(1) || store.get("epms-wb-nurse") || DATA.nurses.find(n=>n.files).slug;
select(DATA.nurses.some(n=>n.slug===first && n.files) ? first : DATA.nurses.find(n=>n.files).slug);
(async()=>{ try{ downloads = window.claude && await window.claude.use("downloads"); }catch(e){ downloads = null; } if(cur) renderViewer(); })();
})();
</script>
